name: Paper C v1.1 Lean development

on:
  push:
    branches:
      - codex/paper-c-v2-mathematics
    paths:
      - 'PaperCV11.lean'
      - 'PaperCV11/**'
      - '.github/workflows/v11-development.yml'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  pull_request:
    paths:
      - 'PaperCV11.lean'
      - 'PaperCV11/**'
      - '.github/workflows/v11-development.yml'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_ABORT_ON_PANIC: '1'

jobs:
  build-v11-development:
    name: Build Paper C v1.1 development surface
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the development branch
        # actions/checkout v4.2.2; same audited pin as the retained workflow.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up the pinned Lean toolchain
        # leanprover/lean-action v1; same audited pin as the retained workflow.
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Compile the isolated v1.1 surface
        shell: bash
        run: |
          set -euo pipefail
          lake build PaperCV11

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' PaperCV11.lean PaperCV11; then
            echo 'Proof placeholder found in PaperCV11.' >&2
            exit 1
          fi
