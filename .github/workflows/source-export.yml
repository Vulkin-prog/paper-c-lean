name: source-export

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v049-paper-c-v09-sync
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact checkout
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_COMMIT.txt
          tar --exclude=.git -czf paper-c-lean-source.tar.gz .
          sha256sum paper-c-lean-source.tar.gz > paper-c-lean-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: paper-c-lean-source-${{ github.sha }}
          path: |
            paper-c-lean-source.tar.gz
            paper-c-lean-source.tar.gz.sha256
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
