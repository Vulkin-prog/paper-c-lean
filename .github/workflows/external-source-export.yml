name: external-source-export

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v049-paper-c-v09-sync
    paths:
      - .github/workflows/external-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlexKontorovich/PrimeNumberTheoremAnd
          ref: 21998bb6196b56789f72a52656a781a75e134eb0
          path: pnt
      - name: Package exact external source
        run: |
          set -euo pipefail
          mkdir -p export
          git -C pnt rev-parse HEAD > export/PNT_COMMIT.txt
          git -C pnt archive --format=tar.gz --output="$GITHUB_WORKSPACE/export/PrimeNumberTheoremAnd-source.tar.gz" HEAD
          sha256sum export/PrimeNumberTheoremAnd-source.tar.gz > export/PrimeNumberTheoremAnd-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: external-pnt-source
          path: export/
          if-no-files-found: error
          retention-days: 7
