name: pnt-kernel-check

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v049-paper-c-v09-sync
    paths:
      - .github/workflows/pnt-kernel-check.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Checkout exact PNT source
        uses: actions/checkout@v4
        with:
          repository: AlexKontorovich/PrimeNumberTheoremAnd
          ref: 21998bb6196b56789f72a52656a781a75e134eb0
          fetch-depth: 1
      - name: Write dependency check
        run: |
          cat > CheckPNT.lean <<'EOF'
          import PrimeNumberTheoremAnd.Consequences
          #print axioms WeakPNT
          #print axioms pi_asymp
          #print axioms pi_alt'
          EOF
      - name: Build exact PNT module
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build-args: PrimeNumberTheoremAnd.Consequences
      - name: Check kernel dependencies
        run: |
          set -euo pipefail
          lake env lean CheckPNT.lean 2>&1 | tee pnt-dependencies.txt
          if grep -Eq 'sorryAx|Lean\.ofReduceBool' pnt-dependencies.txt; then
            echo 'Unexpected dependency in PNT check' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnt-kernel-check
          path: pnt-dependencies.txt
          if-no-files-found: warn
          retention-days: 7
