name: pnt-integration-check-3
on:
  workflow_dispatch:
  push:
    branches: [agent/v049-paper-c-v09-sync]
    paths:
      - PaperC/Arithmetic/PNT*.lean
      - PaperC/Arithmetic/PrimeCountingBridgePNT.lean
      - PaperC/Arithmetic/PrimeNumberTheoremDischarge.lean
      - CheckPNTDischarge.lean
      - lakefile.toml
      - .github/workflows/pnt-kernel-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - run: lake update PrimeNumberTheoremAnd
      - uses: actions/upload-artifact@v4
        with:
          name: pnt-generated-manifest
          path: lake-manifest.json
          if-no-files-found: error
          retention-days: 7
      - run: lake build PaperC.Arithmetic.PrimeNumberTheoremDischarge
      - run: lake env lean CheckPNTDischarge.lean
