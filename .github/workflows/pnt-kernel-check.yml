name: pnt-integration-check
on:
  workflow_dispatch:
  push:
    branches: [agent/v049-paper-c-v09-sync]
    paths: [.github/workflows/pnt-kernel-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - run: lake update PrimeNumberTheoremAnd
      - run: lake build PaperC.Arithmetic.PrimeCountingBridgePNT
      - run: lake build PaperC.Arithmetic.PrimeNumberTheoremDischarge
