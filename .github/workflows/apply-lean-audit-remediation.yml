name: Apply paper-c-lean audit remediation

on:
  push:
    branches:
      - agent/v0481-publication-metadata
    paths:
      - .github/workflows/apply-lean-audit-remediation.yml
      - .github/bootstrap/lean-audit-remediation.part*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-audit-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0481-publication-metadata
          fetch-depth: 0

      - name: Reassemble and verify the remediation payload
        run: |
          cat .github/bootstrap/lean-audit-remediation.part{00..06} > /tmp/lean-audit-remediation.tar.gz.b64
          test "$(wc -c < /tmp/lean-audit-remediation.tar.gz.b64)" = "32676"
          printf '%s  %s\n' \
            '846dd48a899b42777eb29253559d084f777aaa0e7e642c83103eb770c0909fb3' \
            '/tmp/lean-audit-remediation.tar.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/lean-audit-remediation.tar.gz.b64 > /tmp/lean-audit-remediation.tar.gz
          printf '%s  %s\n' \
            '7950f4d99ee1a6c3f9193816a1de17bd8a1f97cb337b4a1adafab973737066ac' \
            '/tmp/lean-audit-remediation.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/lean-audit-remediation.tar.gz --directory .github/bootstrap
          python3 -m py_compile .github/bootstrap/patch_lean_audit.py

      - name: Apply the documented remediation
        run: python3 .github/bootstrap/patch_lean_audit.py

      - name: Install structural audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qpdf poppler-utils ripgrep

      - name: Regenerate derived audit artifacts
        run: node scripts/generate_audit.mjs

      - name: Validate new scripts, workflows and PDF artifacts
        run: |
          bash -n scripts/qa_pdfs.sh
          node --check scripts/create_release_binding.mjs
          node --check scripts/verify_release_binding.mjs
          scripts/qa_pdfs.sh ci-logs/pdf-qa-remediation
          node scripts/generate_audit.mjs --check-pdfs
          node scripts/generate_audit.mjs --check-source-digest
          node scripts/generate_audit.mjs --check-literature-certificates
          node scripts/check_comparator_sources.mjs
          node scripts/test_audit_root_guards.mjs
          git diff --check

      - name: Remove one-shot bootstrap material
        run: |
          rm -f .github/bootstrap/lean-audit-remediation.part{00..06}
          rm -f .github/bootstrap/patch_lean_audit.py
          rm -f .github/bootstrap/mathematical_report.md
          rm -f .github/bootstrap/repository_report.md
          rm -rf .github/bootstrap/__pycache__
          rm -f .github/workflows/apply-lean-audit-remediation.yml
          rmdir .github/bootstrap 2>/dev/null || true
          rm -rf ci-logs/pdf-qa-remediation

      - name: Commit the audited candidate changes
        run: |
          git config user.name 'paper-c-audit-bot'
          git config user.email 'paper-c-audit-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'audit: remediate v0.48.1 publication and qualification findings'
          git push origin HEAD:agent/v0481-publication-metadata
