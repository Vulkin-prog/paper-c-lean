name: Palomar qualification

on:
  pull_request:
    paths:
      - ".github/workflows/palomar-qualification.yml"
      - "palomar/**"
      - "comparator/*.json"
      - "Challenge*.lean"
      - "Solution*.lean"
      - "PaperC.lean"
      - "PaperC/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate Palomar metadata - ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: theorem-one-one
            metadata: palomar/formalization.yaml
            config: comparator/theorem_one_one.json
            expected: '["paper_c_theorem_one_one_finite_cylinder"]'
          - label: theorem-one-two
            metadata: palomar/theorem_one_two/formalization.yaml
            config: comparator/theorem_one_two.json
            expected: '["paper_c_theorem_one_two_i_deterministic_masks","paper_c_theorem_one_two_ii_spatial_laplace","paper_c_theorem_one_two_iii_marked_laplace_and_tightness"]'
          - label: theorem-one-four-and-corollary-eleven-three
            metadata: palomar/theorem_one_four_and_corollary_eleven_three/formalization.yaml
            config: comparator/theorem_one_four_and_corollary_eleven_three.json
            expected: '["paper_c_theorem_one_four_moments","paper_c_corollary_eleven_three"]'
          - label: theorem-sixteen-two-and-corollary-sixteen-four
            metadata: palomar/theorem_sixteen_two_and_corollary_sixteen_four/formalization.yaml
            config: comparator/theorem_sixteen_two_and_corollary_sixteen_four.json
            expected: '["paper_c_theorem_sixteen_two_finite_cylinder","paper_c_theorem_sixteen_two_finite_cylinder_recentered","paper_c_theorem_sixteen_two_infinite_model","paper_c_corollary_sixteen_four_prefix_law"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Check Mathlib canonical master ancestry
        run: ./palomar/check-mathlib-canonical-ancestry.sh
      - name: Check against the pinned Palomar submission contract
        shell: bash
        env:
          PALOMAR_METADATA: ${{ matrix.metadata }}
          PALOMAR_CONFIG: ${{ matrix.config }}
          EXPECTED_THEOREMS: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          policy_root="$RUNNER_TEMP/PalomarSubmission"
          git clone --filter=blob:none \
            https://github.com/PalomarRegistry/PalomarSubmission.git \
            "$policy_root"
          git -C "$policy_root" checkout \
            0a2c287a924d2a7cb22e2b12f12b27321bb485a3
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps -r "$policy_root/requirements.txt"
          PALOMAR_SUBMISSION="$policy_root" python - <<'PY'
          import os
          import json
          import pathlib
          import sys

          root = pathlib.Path(os.environ["PALOMAR_SUBMISSION"])
          sys.path.insert(0, str(root))

          from scripts.submission_contract import (
              load_formalization_metadata,
              normalized_provenance,
          )
          from scripts.verify_submission import load_comparator_config

          metadata = load_formalization_metadata(
              pathlib.Path(os.environ["PALOMAR_METADATA"])
          )
          provenance = normalized_provenance(metadata)
          config = load_comparator_config(
              pathlib.Path(os.environ["PALOMAR_CONFIG"])
          )

          assert metadata.get("version") == "v0.4"
          assert provenance["repository_role"] == "substantive-development"
          assert provenance["result_origin"] == "source-based"
          assert config["theorem_names"] == json.loads(
              os.environ["EXPECTED_THEOREMS"]
          )
          print("PALOMAR_METADATA_CONTRACT_OK")
          PY

  nanoda:
    name: Replay with Lean and NanoDa - ${{ matrix.label }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: theorem-one-one
            config: comparator/theorem_one_one.json
          - label: theorem-one-two
            config: comparator/theorem_one_two.json
          - label: theorem-one-four-and-corollary-eleven-three
            config: comparator/theorem_one_four_and_corollary_eleven_three.json
          - label: theorem-sixteen-two-and-corollary-sixteen-four
            config: comparator/theorem_sixteen_two_and_corollary_sixteen_four.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache: false
      - name: Run the pinned dual-kernel Comparator replay
        env:
          PALOMAR_COMPARATOR_CACHE: ${{ runner.temp }}/paper-c-palomar
        run: ./palomar/verify-comparator.sh "${{ matrix.config }}"
