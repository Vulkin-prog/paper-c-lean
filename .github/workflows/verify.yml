name: verify
on:
  push:
  workflow_dispatch:
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Coherence registre/audit/manifest
        run: node scripts/generate_audit.mjs --check
      - name: Cache Mathlib
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Audit d'axiomes (liste blanche)
        run: |
          lake env lean AuditCheck.lean > audit_out.txt 2>&1
          python3 - <<'PY'
          import re,sys
          t=open('audit_out.txt').read(); flat=t.replace('\n',' ')
          n=len(re.findall(r'depends on axioms',flat)); z=len(re.findall(r'does not depend on any axioms',flat))
          axs=set(x.strip() for g in re.findall(r'depends on axioms: \[([^]]*)\]',flat) for x in g.split(','))
          bad=axs-{'propext','Classical.choice','Quot.sound'}
          err=[l for l in t.splitlines() if re.search(r'error:|unknown (identifier|constant)',l)]
          print(f'verdicts={n} zero-axiome={z} axiomes={sorted(axs)} erreurs={len(err)}')
          sys.exit(1 if (bad or err or n+z==0) else 0)
          PY
