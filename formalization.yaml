  divergences: "The principal human-readable Comparator statement uses a finite uniform cylinder because the dyadic observable depends on finitely many prime coordinates; a separate Comparator target states the exact identity with the infinite-product law. The finite-cylinder interface uses a truncated completely multiplicative function, with an explicit convention outside the prime cutoff, although the audited observable never queries that region. Total variation is displayed as the discrete half-l1 sum rather than the paper's equivalent supremum over events. UniformBigOOn makes the uniform quantifiers and the dependence on C explicit. The Lean endpoint harmlessly permits C = 0 whereas the paper states C > 0. Theorem 8.1 is closed only at alpha = 3/16, the instance consumed downstream, rather than for every alpha > 0 as stated in the paper. The role of Lemma 13.6 is discharged by a sufficient harmonic bound rather than by a declaration duplicating its displayed formulation. The spatial and marked point-process results are represented by Laplace-functional convergence together with tightness, not by direct Tendsto statements for laws in the paper's vague topology. Conditioning is formalized extensionally through equality of the relevant finite-coordinate laws rather than through a literal conditional-probability presentation. The global longest-run theorem is outside the v0.48.0 Comparator surface. The literature bridges are ordinary theorem premises, not Lean axioms."
