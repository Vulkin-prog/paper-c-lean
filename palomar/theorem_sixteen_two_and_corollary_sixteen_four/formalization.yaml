    relationship: "background"
    note: >-
      The sequential real form pi(L) log(L)/L -> 1 is exposed as hPNT. Its
      source implication is not proved by the compared declaration.
  - title: "Number of prime divisors in a product of consecutive integers"
    authors:
      - "Shanta Laishram"
      - "T. N. Shorey"
