version: "v0.4"

project:
  name: "Paper C: the global and finite-prefix Poisson laws"
  description: >-
    Lean 4 formalization of Paper C, Theorem 16.2 and Corollary 16.4. The
    selected declarations give the global interior start-count Poisson law on
    a finite prime-sign cylinder, its recentering at M/2^L, the corresponding
    theorem on the infinite Rademacher product, and the finite-prefix
    start-count and longest-stretch law. All asymptotics are uniform in the
    critical window |L - log_2 M| <= C. Each declaration is conditional on
    exactly six fully stated ordinary source propositions; those propositions
    are theorem arguments, not Lean axioms.
  authors:
    - "Brice Pouly"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Brice Pouly"

classification:
  arxiv:
    - "math.NT"
    - "math.PR"
  msc2020:
    - "11K65"
    - "60F05"

