fidelity:
  divergences: >-
    The finite-cylinder declarations use the exact finite prime-sign cylinder
    on which the observable depends; a separately selected declaration states
    the same exact-mean result directly on the paper's infinite product law.
    Bits in ZMod 2 encode signs. Start predicates are totalized on natural
    numbers, although the selected counts only use the manuscript ranges.
    Total variation is the discrete half-l1 expression, equivalent to the
    event-supremum convention. UniformLittleOOn exposes a threshold independent
    of L and allowed to depend on C. The exact-mean form first compares with
    Pois(Lambda_M), while the recentered form compares with Pois(M/2^L); both
    forms selected here are part of the formal theorem surface. Most
    importantly, the paper presents Theorem 16.2 and Corollary 16.4 without
    theorem-level premises, while every compared declaration is explicitly
    conditional on the six source-shaped propositions hPNT, hLS, hDivisor,
    hBS, hAGG, and hES. Their source implications are documented by repository
    audit materials but are not kernel proofs or independent external human
    certifications.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Fable 5 agent instances"
    - "Claude Opus 4.8 agent instances"
    - "OpenAI GPT 5.6 Sol agent instances"
  notes: >-
    Distinct agent instances and models performed repeated adversarial
    mathematical, source, Lean, and release counter-reviews, alongside
    mechanical declaration and axiom audits. These procedures are neither
    independent scientific validation nor human peer review. No independent
    external human mathematical peer review has been completed. The six
    literature certificates assess source-to-proposition implications but do
    not turn the hypotheses into kernel-verified theorems.

alignment:
  namespace: "PaperCAudit"
  statements:
    - source: "Paper C, Theorem 16.2, printed/PDF pp. 54--55"
      lean: "paper_c_theorem_sixteen_two_finite_cylinder"
      module: "SolutionTheoremSixteenTwo"
      status: "proved modulo six explicit ordinary literature premises"
      note: >-
        Uniformly in |L-log(M)/log(2)| <= C, the finite-cylinder global
        start-count law is o_C(1) in total variation from Pois(Lambda_M),
        Lambda_M-M/2^L=o_C(M/2^L), and its zero mass differs by o_C(1) from
        exp(-Lambda_M).
    - source: "Paper C, Theorem 16.2, printed/PDF pp. 54--55"
      lean: "paper_c_theorem_sixteen_two_finite_cylinder_recentered"
      module: "SolutionTheoremSixteenTwo"
      status: "proved modulo six explicit ordinary literature premises"
      note: >-
        The same finite-cylinder law is o_C(1) in total variation from the
        printed Pois(M/2^L), and its zero mass is exp(-M/2^L)+o_C(1).
    - source: "Paper C, Theorem 16.2, printed/PDF pp. 54--55"
      lean: "paper_c_theorem_sixteen_two_infinite_model"
      module: "SolutionTheoremSixteenTwo"
      status: "proved modulo six explicit ordinary literature premises"
      note: >-
        The exact-mean statement is expressed directly for the literal global
        start count under the infinite Rademacher product measure.
    - source: "Paper C, Corollary 16.4, printed/PDF p. 55"
      lean: "paper_c_corollary_sixteen_four_prefix_law"
      module: "SolutionTheoremSixteenTwo"
      status: "proved modulo six explicit ordinary literature premises"
      note: >-
        The infinite-product finite-prefix start-count law is o_C(1) in total
        variation from Pois(M/2^L), and P(R_M<L)=exp(-M/2^L)+o_C(1).

