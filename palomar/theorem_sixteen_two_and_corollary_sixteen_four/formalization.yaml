  - title: "Squares in products from a block of consecutive integers"
    authors:
      - "R. Balasubramanian"
      - "T. N. Shorey"
    id: "https://doi.org/10.4064/aa-65-3-213-220"
    type: "paper"
    location: "Theorem 1 and equations (1), (4), and (5), printed pp. 213--214"
    relationship: "background"
    note: >-
      The equivalent finset form of the dense square-subproduct theorem is
