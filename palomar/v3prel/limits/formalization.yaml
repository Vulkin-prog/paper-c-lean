version: v0.4
project:
  name: Threshold staircases and the Poisson–Gaussian bridge
  description: Joint Poisson–Gaussian limits for conditioned run counts, with an autoregressive Gaussian
    target and independent normal innovations. Quantitative results give local Poisson probabilities,
    a Gaussian distribution-function bound, moderate deviations, and relative local or tail estimates
    for the multiplicative source under the stated information budgets. The whole integer-level point
    process has locally finite but infinite total mass; its complete upper-half laws, conditioning on
    a fixed count and extreme phases are included. The two upper-half law assertions include proved
    measurability and probability normalization; conditioning on every finite count has positive mass.
    The intrinsic probability estimates are proved internally.
    Their arithmetic applications use, as applicable, the prime number theorem, scalar Stein bounds, the
    Poisson process estimate of Arratia, Goldstein and Gordon, and Barbour's corrected multivariate Stein
    bounds.
  authors:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
