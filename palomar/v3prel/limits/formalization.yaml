version: v0.4
project:
  name: V3PREL threshold staircase, Poisson–Gaussian bridge and integer-level process
  description: >-
    Joint Poisson–Gaussian limits for conditioned run counts, with an autoregressive Gaussian
    target and independent normal innovations. Quantitative results give local Poisson
    probabilities, a Gaussian distribution-function bound, moderate deviations, and relative
    local or tail estimates for the multiplicative source under the stated information budgets.
    The whole integer-level point process has locally finite but infinite total mass; its
    complete upper-half laws, conditioning on a fixed count and extreme phases are included. The
    intrinsic probability estimates are proved internally. Their arithmetic applications use, as
    applicable, the prime number theorem, scalar Stein bounds, the Poisson process estimate of
    Arratia, Goldstein and Gordon, and Barbour's corrected multivariate Stein bounds.
  authors:
  - Brice Pouly
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
classification:
  arxiv:
  - math.NT
  - math.PR
  msc2020:
  - 11K65
  - 60F05
sources:
- title: Long runs and rare patterns of a random completely multiplicative function, version 3PREL
  authors:
  - Brice Pouly
  id: https://github.com/Vulkin-prog/paper-c-lean/blob/ee2ac789764fe5d9fd19c96c6c0778a693b129a0/manuscripts/v3prel/paper_C_version_3PREL_en.pdf
  type: paper
  location: Section 5, Theorem 5.10; Section 6, central/local and moderate-deviation consequences.
    Source snapshot manuscripts/v3prel/paper_C_version_3PREL_en.pdf, SHA-256 0ec4144dc81c4ee9930a8e4e4815ae274da36e3c1ebeae4a5c0ffa411853a9d7.
  relationship: adapts
  license: CC-BY-4.0
  author_endorsement: participated
  note: Exactly the 29 declarations listed in comparator/v3prel_limits.json are selected; the repository
    source mapping has a broader scope.
- title: Technical companion to Long runs and rare patterns of a random completely multiplicative
    function, version 3PREL
  authors:
  - Brice Pouly
  type: paper
  location: Sections D.1 and D.4; corrected directional Stein input C.3. Snapshot manuscripts/v3prel/paper_C_version_3PREL_technical_companion_en.pdf,
    SHA-256 d64150c995f07ee39b016bb20a16b5fc3a01ce53b0ddcda893d1ceb41eefadee.
  relationship: adapts
  note: D.1 includes explicit Stirling bounds and effective Gaussian estimates; D.4 includes the whole
    locally finite process, infinite total mass, complete upper-half laws, conditional marks, compact-test
    Laplace functionals and extreme phases.
- title: 'Two moments suffice for Poisson approximations: the Chen--Stein method'
  authors:
  - Richard Arratia
  - Larry Goldstein
  - Louis Gordon
  id: https://doi.org/10.1214/aop/1176991491
  type: paper
  location: Theorem 2, printed page 11, exact dependency-graph specialization
  relationship: background
  note: Process.ProcessAGGStatement states the finite field comparison in half-l1 convention with
    factor 2(b1+b2), exact outside-vector independence, and all target coordinates. It is a visible
    theorem argument. The arithmetic dependency graph and its costs are proved internally, not supplied
    as premises.
- title: Newman's Short Proof of the Prime Number Theorem
  authors:
  - Don Zagier
  id: https://doi.org/10.2307/2975232
  type: paper
  location: American Mathematical Monthly 104 (1997), pages 705-708
  relationship: background
  note: Analysis.PrimeNumberTheoremRemainder is the ordinary prime-counting remainder o(t/log t),
    with Li(t)=Ei(log t). The normalization of Ei, saddle roots and weighted prime estimates are proved
    in the local development. No desired arithmetic error is assumed.
- title: Stein's Method and Poisson Process Convergence
  authors:
  - A. D. Barbour
  id: https://doi.org/10.2307/3214155
  type: paper
  location: Journal of Applied Probability 25(A) (1988), page 179, Lemmas 2 and 3
  relationship: background
  note: Analysis.DirectionalSteinFactorsStatement requires one solution of the actual multivariate
    Poisson Stein equation with constant entrywise bound and weighted quadratic-form bound. It contains
    no unweighted Euclidean quadratic bound. The previous overlay's stronger Euclidean premise was
    false and is refuted by DirectionalSteinCounterexample; this new candidate uses the corrected
    source-faithful proposition. No final comparison or arithmetic conclusion is part of this analytic
    input.
- title: Poisson Approximation
  authors:
  - A. D. Barbour
  - Lars Holst
  - Svante Janson
  type: book
  location: Scalar Poisson Stein equation and its standard first-difference factor, as explicitly
    stated by Analysis.ScalarPoissonSteinStatement.
  relationship: background
  note: The analytic solution bound is an ordinary visible theorem argument. No final approximation
    or arithmetic error bound is assumed.
- title: Paper C and technical companion — Zenodo publication record
  authors:
  - Brice Pouly
  id: https://doi.org/10.5281/zenodo.21736676
  type: paper
  relationship: background
  note: Concept DOI for the paper and companion across published versions. This earlier publication
    record is distinct from the archived V3PREL source above; it does not supply a version-specific
    DOI for that snapshot or a literature hypothesis for the proofs.
- title: Critical Poisson fields for long constant stretches of a random completely multiplicative
    function, Cambridge Open Engage version 2
  authors:
  - Brice Pouly
  id: https://doi.org/10.33774/coe-2026-z3l74-v2
  type: paper
  location: Published 4 September 2026, version 2.
  relationship: background
  note: Earlier public version, cited for publication history. Its title and DOI identify Cambridge
    version 2, not the archived V3PREL source used by this formalization; it is not an additional
    mathematical premise.
