status:
  scope: 29 selected declarations in ChallengeV3Limits, an autonomous Mathlib-only Challenge, with proofs
    in SolutionV3Limits. Joint Poisson–Gaussian limits for conditioned run counts, with an autoregressive
    Gaussian target and independent normal innovations. Quantitative results give local Poisson probabilities,
    a Gaussian distribution-function bound, moderate deviations, and relative local or tail estimates
    for the multiplicative source under the stated information budgets. The whole integer-level point
    process has locally finite but infinite total mass; its complete upper-half laws, conditioning on
    a fixed count and extreme phases are included. The two upper-half law assertions include proved measurability
    and probability normalization; conditioning on every finite count has positive mass. The intrinsic
    probability estimates are proved internally. Their arithmetic applications use, as applicable, the
    prime number theorem, scalar Stein bounds, the Poisson process estimate of Arratia, Goldstein and
    Gordon, and Barbour's corrected multivariate Stein bounds. Intentional proof placeholders occur only
    in the Challenge. Literature inputs remain explicit theorem arguments and are not discharged by kernel
    validation. Version 1 is registered as PALOMAR-2026-09-20-000007. This metadata prepares a version
    2 publication update with the same declaration selection; no version 2 decision is asserted.
