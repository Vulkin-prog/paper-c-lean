version: v0.4
project:
  name: Threshold staircases and the Poisson–Gaussian bridge
  description: For a random completely multiplicative function with independent symmetric signs at the
    primes, counts of long runs at several length thresholds exhibit a transition from Poisson to Gaussian
    behavior. The results describe joint limits across the threshold staircase, with an autoregressive
    Gaussian target and independent normal innovations. Quantitative estimates cover local probabilities,
    central approximation and moderate deviations, together with conditional transfers under the stated
    information budgets. The associated integer-level point process includes upper-half laws, conditioning
    on a fixed finite count and extreme phases. Arithmetic applications retain explicit prime number theorem
    and scalar, process or multivariate Poisson approximation inputs, as applicable.
  authors:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
