automation:
  methods:
  - method: agent
    models:
    - GPT-6 Codex agents
    framework: Codex
    tool_setup: Agent-assisted mathematical development, source checks, Lean builds, and independent
      agent review, directed by the human maintainer.
    prompting_notes: Preserve actual sources and targets, expose literature propositions, and use
      standalone challenge modules with separately proved bridges.
  notes: The repository contains the substantive proofs, so repository metadata is omitted and the
    ordinary substantive-development classification applies. Proof development and comparison-interface
    review are not human peer review.
fidelity:
  divergences: The joint limit is weak convergence of explicit probability laws, with equality to
    the true conditioned source pushforward required in the conclusion. The Gaussian covariance, AR
    recursion and independent normal innovations are explicit. The scalar quantitative estimates are
    proved internally; the arithmetic hard and soft local transfers and hard moderate-tail transfer
    expose their actual information budgets. D.4 is represented by the same whole integer-level point
    measure, its complete compact-test Laplace functional and actual upper-half restrictions. A separate
    vague-topology convergence declaration is not selected. The total upper-half count is Poisson;
    conditioning on any count n yields n iid uniform positions and independent nonnegative geometric
    marks. A constant sign is a dummy coordinate in this unmarked D.4 representation, not a claimed
    random sign. The half-line construction is totalized on a null set, with its equality to the whole-process
    restriction proved almost everywhere. The extreme endpoint is the actual source event. Saddle
    roots and finite source configurations are selected by epsilon, with uniqueness bridges proved
    in the solution. Only the explicit process AGG, scalar Stein, corrected directional Stein and
    ordinary PNT propositions are used where required; none assumes the desired arithmetic or limit
    conclusion. No new Lean axiom is introduced.
review:
  status: agent-reviewed
  notes: Local compilation and independent interface review are recorded separately. Current immutable-commit
    Comparator/NanoDa evidence must be supplied by the V3PREL qualification workflow; historical qualifications
    do not bind these files.
