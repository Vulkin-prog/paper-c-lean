status:
  scope: New candidate v3prel_crossover. One standalone Mathlib-only Challenge (442 lines, 27446 bytes)
    and one independently defined Solution, with 11 selected theorem declarations. Intentional placeholders
    occur only in the Challenge; the Solution has no proof holes. The selected declarations use the least
    genuinely contained departure, the full signed excess record and an independent geometric/uniform-site/fair-sign
    mixture with moving weights. They give the full marked TV limit, the ordinary and source-resolved
    positions in all three real/infinite phase regimes, and the actual sign bias. The affine family uses
    varying linear maps and right-hand sides on the true hard prime cylinder, compatibility only eventually,
    and the actual rank information budget. Its exact conditional border mass is 2^(-d), with d the true
    row-space deficit. Affine localization and sign bias require no future neutrality; the full affine
    marked clock assumes neutrality only eventually for each fixed finite future prefix. No Palomar outcome,
    Comparator pass or NanoDa result is asserted by this metadata.
