  type: paper
  location: RIMS Kokyuroku 886 (1994), pages 55-56, equation (15) and the square case
  relationship: background
  note: Boundary.ShoreySquareProductStatement displays the square-product exclusion with arbitrary positive
    smooth coefficient, true height and density thresholds, and uniform quantifier order. The arithmetic/probability
    consequences are proved internally.
