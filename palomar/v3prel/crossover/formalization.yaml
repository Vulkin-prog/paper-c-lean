  location: American Mathematical Monthly 104 (1997), pages 705-708
  relationship: background
  note: Analysis.PrimeNumberTheoremRemainder is the ordinary prime-counting remainder o(t/log t); the
    exact Ei normalization is displayed. The weighted prime estimates and saddle consequences are internal.
