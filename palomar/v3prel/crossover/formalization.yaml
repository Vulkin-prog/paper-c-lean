version: v0.4
project:
  name: V3PREL moving crossover mixtures and affine first-departure localization
  description: >-
    Conditioned on the presence of a run contained in a finite prefix, the first such run has a
    mixture law combining a microscopic border contribution with a uniform bulk location,
    geometric excess and fair sign. The results retain the marked record, describe both location
    scales in finite and infinite phase regimes, and determine the sign bias. Under compatible
    affine conditions on small primes, the border probability is exactly 2^(-d), where d is the
    row-space deficit. Affine localization and sign bias use the rank information budget without
    future neutrality; the full marked-clock limit also requires eventual neutrality for each
    fixed finite future prefix. Approximation uses the prime number theorem, the Poisson process
    estimate of Arratia, Goldstein and Gordon, and the stated Laishram–Shorey, Shorey and
    Nicolas–Robin estimates. The exact affine border identity needs none of these literature
    hypotheses.
  authors:
  - Brice Pouly
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
