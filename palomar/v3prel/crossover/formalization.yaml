fidelity:
  divergences: The record explicitly has a cemetery value, a border component containing the prime-rank
    clock, and a bulk component containing the actual integer site, full excess and F2 sign. Position
    limits are stated by all bounded continuous test integrals on the true laws conditioned by A intersected
    with non-vacancy, equivalent to weak convergence. False labels are microscopic with x/L^2, true labels
    are bulk with x/M. A null clock is totalized to zero; the proof shows the exceptional events vanish.
    The bulk target uses the actual contained population, so its weights may oscillate. The affine codomain
    may vary and be any F2 module. The finite future row-space condition is fully displayed; no desired
    TV error is a premise. Right-censored variants and the separate resolved-future theorems of Section
    6 are not selected by this candidate. The paper states its results without theorem-level premises,
    whereas the Lean endpoints explicitly consume the displayed literature propositions. Those hypotheses
    are not proved by kernel checking the conditional results.
    Every selected asymptotic endpoint additionally proves eventual positive conditioning mass,
    measurability of the record and first-start maps, and probability normalization of the record,
    target and both location laws. Weakly explicitly includes eventual source normalization and target
    normalization in addition to all bounded continuous test integrals. These conclusions require no
    extra assumptions, including no future-neutrality assumption for location or sign endpoints.
review:
  status: agent-reviewed
  notes: Source-to-interface bridges and selected statements were checked during preparation. Mechanical
    checks are recorded separately in qualification evidence. There is no independent human peer review
    or claimed Palomar decision. The probability and measurability guarantees were audited and exposed
    in the standalone interface after the Limits review; this is not a prediction of registration.
