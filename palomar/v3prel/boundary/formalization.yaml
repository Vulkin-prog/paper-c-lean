fidelity:
  divergences: F2 bits encode signs, with zero meaning positive. The prefix count includes the genuine
    border indicator and starts from 2 through M-L+1. The selected quantitative inequality uses explicit
    constants 43 and 4 and keeps the exact border and L*2^(-L) terms. The small fixed exponent 1/256 is
    a weakening of the internally proved 1/12 choice. The actual longest run is defined by the finite
    maximum of contained constant lengths. No dyadic surrogate replaces it. These seven declarations do
    not individually restate every microscopic arithmetic lemma, the prime-clock law or the entire article.
    The paper states its results without theorem-level premises, whereas the Lean endpoints explicitly
    consume the displayed literature propositions. Those hypotheses are not proved by kernel checking
    the conditional results.
    The selected exact-border declaration also proves measurability and positive probability of the
    border and microscopic events, normalization of their conditional laws and all mesoscopic record
    pushforwards, and measurability and mass-sum one of every prefix count law.
review:
  status: agent-reviewed
  notes: Source-to-interface bridges and selected statements were checked during preparation. Mechanical
    checks are recorded separately in qualification evidence. There is no independent human peer review
    or claimed Palomar decision. The probability and measurability guarantees were audited and exposed
    in the standalone interface after the Limits review; this is not a prediction of registration.
