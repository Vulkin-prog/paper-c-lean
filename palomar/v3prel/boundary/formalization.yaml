status:
  scope: 7 selected declarations in ChallengeV3Boundary, an autonomous Mathlib-only Challenge, with proofs
    in SolutionV3Boundary. The exact left-border probability is 2^(-pi(L)), and the microscopic non-vacancy
    probability satisfies 0 <= q_L/2^(-pi(L)) - 1 <= 2^(-pi(L)/256) for sufficiently large L. The results
    give conditional localization and uniqueness, stability under changes of mesoscopic cutoff, and a
    quantitative Poisson law for runs contained in a finite prefix. They yield the critical longest-run
    distribution and asymmetric almost-sure envelopes for all integer prefix lengths. The exact border
    identity needs no literature hypothesis. The asymptotic results use, as applicable, scalar Stein bounds,
    the prime number theorem, the uniform prime-divisor estimate of Laishram and Shorey, Shorey's square-product
    exclusion, and the divisor bound of Nicolas and Robin. Intentional proof placeholders occur only in
    the Challenge. Literature inputs remain explicit theorem arguments and are not discharged by kernel
    validation. Version 1 is registered as PALOMAR-2026-09-20-000011. This metadata prepares a version
    2 publication update with the same declaration selection; no version 2 decision is asserted.
