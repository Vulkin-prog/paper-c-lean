version: v0.4
project:
  name: Microscopic boundary, prefixes and longest runs
  description: For a random completely multiplicative function with independent symmetric signs at the
    primes, the beginning of the positive integers has a special role in the occurrence of long constant
    runs. The probability of a positive run of length L at the left border is exactly 2^(-pi(L)), where
    pi counts primes. The microscopic non-vacancy probability has this leading term with a quantified
    relative error. The results give conditional localization and uniqueness, stability under mesoscopic
    cutoffs, a Poisson law for runs contained in finite prefixes, and critical distributions and almost-sure
    envelopes for the longest run. The exact border identity has no literature premise; the asymptotic
    statements use the specified Stein, prime number theorem, Laishram–Shorey, Shorey and Nicolas–Robin
    inputs.
  authors:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
