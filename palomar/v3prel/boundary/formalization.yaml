version: v0.4
project:
  name: Microscopic boundary, prefixes and longest runs
  description: The exact left-border probability is 2^(-pi(L)), and the microscopic non-vacancy probability
    satisfies 0 <= q_L/2^(-pi(L)) - 1 <= 2^(-pi(L)/256) for sufficiently large L. The results give conditional
    localization and uniqueness, stability under changes of mesoscopic cutoff, and a quantitative Poisson
    law for runs contained in a finite prefix. They yield the critical longest-run distribution and asymmetric
    almost-sure envelopes for all integer prefix lengths. The exact border identity needs no literature
    hypothesis. The asymptotic results use, as applicable, scalar Stein bounds, the prime number theorem,
    the uniform prime-divisor estimate of Laishram and Shorey, Shorey's square-product exclusion, and
    the divisor bound of Nicolas and Robin.
  authors:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
