  authors:
  - Brice Pouly
  id: https://doi.org/10.33774/coe-2026-z3l74
  type: paper
  location: Theorem 7.1, Proposition 7.3 (mesoscopic stability), Theorem 7.4, Corollary 7.5; equations
    (7.1), (7.11)-(7.13). Snapshot manuscripts/v3prel/paper_C_version_3PREL_en.pdf, SHA-256 0ec4144dc81c4ee9930a8e4e4815ae274da36e3c1ebeae4a5c0ffa411853a9d7.
  relationship: adapts
  license: CC-BY-4.0
  author_endorsement: participated
  note: This is a new candidate, independent of the four historical v0.9 IDs. Its scope is exactly the
    listed declarations; no previous qualification is reused.
- title: Technical companion to Long runs and rare patterns of a random completely multiplicative function,
    version 3PREL
  authors:
  - Brice Pouly
  type: paper
  location: Appendix E and the explicitly cited probability inputs. Snapshot manuscripts/v3prel/paper_C_version_3PREL_technical_companion_en.pdf,
    SHA-256 d64150c995f07ee39b016bb20a16b5fc3a01ce53b0ddcda893d1ceb41eefadee.
  relationship: adapts
  note: All source-shaped literature arguments are visible in the standalone challenge. This family does
    not consume the corrected multivariate directional Stein premise; the correction C002 is exercised
    by other V3PREL candidates.
- title: Poisson approximation of Rademacher functionals by the Chen-Stein method and Malliavin calculus
  authors:
  - Kai Krokowski
  id: https://arxiv.org/abs/1505.01417
  type: paper
  location: arXiv:1505.01417v3, Section 2.5, equations (2.14)-(2.15)
  relationship: background
  note: Analysis.ScalarSteinFactorsStatement requires a solution of the scalar Poisson Stein equation
    with both analytic bounds. No arithmetic TV comparison is assumed.
- title: Number of prime divisors in a product of consecutive integers
  authors:
  - Shanta Laishram
  - T. N. Shorey
  id: https://doi.org/10.4064/aa113-4-3
  type: paper
  location: Acta Arithmetica 113 (2004), equation (14), printed page 331
  relationship: background
  note: Boundary.UniformPrimeDivisorStatement is the published eventual bound uniform in n>k, with the
    threshold before n. It is an ordinary theorem hypothesis, not an axiom or an assumed probability estimate.
- title: Applications of Baker's theory of linear forms in logarithms to exponential diophantine equations
  authors:
  - T. N. Shorey
  type: paper
  location: RIMS Kokyuroku 886 (1994), pages 55-56, equation (15) and the square case
  relationship: background
  note: Boundary.ShoreySquareProductStatement displays the square-product exclusion with arbitrary positive
    smooth coefficient, true height and density thresholds, and uniform quantifier order. The arithmetic/probability
    consequences are proved internally.
- title: Newman’s Short Proof of the Prime Number Theorem
  authors:
  - Don Zagier
  id: https://doi.org/10.2307/2975232
  type: paper
  location: American Mathematical Monthly 104 (1997), pages 705-708
  relationship: background
  note: Analysis.PrimeNumberTheoremRemainder is the ordinary prime-counting remainder o(t/log t); the
    exact Ei normalization is displayed. The weighted prime estimates and saddle consequences are internal.
- title: Majorations explicites pour le nombre de diviseurs de N
  authors:
  - J.-L. Nicolas
  - G. Robin
  id: https://doi.org/10.4153/CMB-1983-078-5
  type: paper
  location: Theorem 1, printed page 485 (1983)
  relationship: background
  note: Boundary.DivisorLogBoundStatement displays log(tau(n))*log(log n) <= 2*log(2)*log n for n>=64,
    a safe source specialization. It supplies no Poisson or crossover conclusion.
