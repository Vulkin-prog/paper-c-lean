version: v0.4
project:
  name: V3PREL microscopic boundary, contained prefix laws and almost-sure longest runs
  description: The actual infinite multiplicative source is used throughout. The selected declarations
    prove the exact border probability, q_L/2^(-pi(L))-1 between zero and 2^(-pi(L)/256), conditional
    uniqueness and TV localization, and stability of true zero-padded mesoscopic records. They also prove
    a quantitative Poisson bound for the contained-prefix count, a uniform critical-window TV and longest-run
    void law, the asymmetric almost-sure envelopes, and the O(loglog M) consequence. The thresholds precede
    the run length. Borel-Cantelli and interpolation to all integer prefixes are internal.
  authors:
  - Brice Pouly
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
classification:
  arxiv:
  - math.NT
  - math.PR
  msc2020:
  - 11K65
  - 60F05
sources:
