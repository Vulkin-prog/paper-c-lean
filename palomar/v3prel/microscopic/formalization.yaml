  scope: 6 selected declarations in ChallengeV3Microscopic, an autonomous Mathlib-only Challenge, with
    proofs in SolutionV3Microscopic. Quantitative comparison of the actual position/excess/sign field
    at growing intensity, retaining the original small-prime conditioning; same-grid dyadic restriction
    and common measurable readouts. Along literal dyadic scales, empirical window counts converge almost
    surely to Poisson, while empirical full vectors have a positive total-variation obstruction. Intentional
    proof placeholders occur only in the Challenge. Literature inputs remain explicit theorem arguments
    and are not discharged by kernel validation. No Palomar editorial approval or registration is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
