- title: Newman's Short Proof of the Prime Number Theorem
  authors:
  - Don Zagier
  id: https://doi.org/10.2307/2975232
  type: paper
  location: American Mathematical Monthly 104 (1997), pages 705-708
  relationship: background
  note: Analysis.PrimeNumberTheoremRemainder is the ordinary prime-counting remainder o(t/log t), with
    Li(t)=Ei(log t). The normalization of Ei, saddle roots and weighted prime estimates are proved in
    the local development. No desired arithmetic error is assumed.
- title: Applications of Baker's theory of linear forms in logarithms to exponential diophantine equations
  authors:
  - T. N. Shorey
  type: paper
  location: RIMS Kokyuroku 886 (1994), pages 55-56, equation (15) and the square case
  relationship: background
  note: Boundary.ShoreySquareProductStatement displays the square-product exclusion with arbitrary positive
    smooth coefficient, true height and density thresholds, and uniform quantifier order. The arithmetic/probability
    consequences are proved internally.
- title: Number of prime divisors in a product of consecutive integers
  authors:
  - Shanta Laishram
  - T. N. Shorey
  id: https://doi.org/10.4064/aa113-4-3
  type: paper
  location: Acta Arithmetica 113 (2004), equation (14), printed page 331
  relationship: background
  note: Boundary.UniformPrimeDivisorStatement is the published eventual bound uniform in n>k, with the
    threshold before n. It is an ordinary theorem hypothesis, not an axiom or an assumed probability estimate.
- title: Majorations explicites pour le nombre de diviseurs de N
  authors:
  - J.-L. Nicolas
  - G. Robin
  id: https://doi.org/10.4153/CMB-1983-078-5
  type: paper
  location: Theorem 1, printed page 485 (1983)
  relationship: background
  note: Boundary.DivisorLogBoundStatement displays log(tau(n))*log(log n) <= 2*log(2)*log n for n>=64,
    a safe source specialization. It supplies no Poisson or crossover conclusion.
- title: Stein's Method and Poisson Process Convergence
  authors:
  - A. D. Barbour
  id: https://doi.org/10.2307/3214155
  type: paper
  location: Journal of Applied Probability 25(A) (1988), page 179, Lemmas 2 and 3
  relationship: background
  note: The weighted quadratic and entrywise analytic Stein solution bounds are explicit in Analysis.DirectionalSolutionBounds.
    Appendix F.2 uses this as a theorem-level premise on the actual finite carrier. The arithmetic conditional
    comparison is proved internally.
