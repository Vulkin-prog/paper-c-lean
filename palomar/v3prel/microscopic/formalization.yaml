  description: Quantitative comparison of the actual position/excess/sign field at growing intensity,
    retaining the original small-prime conditioning; same-grid dyadic restriction and common measurable
    readouts. Along literal dyadic scales, empirical window counts converge almost surely to Poisson,
    while empirical full vectors have a positive total-variation obstruction.
