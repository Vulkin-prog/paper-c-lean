  id: https://doi.org/10.2307/3214155
  type: paper
  location: Journal of Applied Probability 25(A) (1988), page 179, Lemmas 2 and 3
  relationship: background
  note: Analysis.DirectionalSteinFactorsStatement requires one solution of the actual multivariate Poisson
    Stein equation with constant entrywise bound and weighted quadratic-form bound. It contains no unweighted
    Euclidean quadratic bound. The previous overlay's stronger Euclidean premise was false and is refuted
    by DirectionalSteinCounterexample; this new candidate uses the corrected source-faithful proposition.
    No final comparison or arithmetic conclusion is part of this analytic input.
