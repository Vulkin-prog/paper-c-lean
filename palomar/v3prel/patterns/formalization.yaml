version: v0.4
project:
  name: Typical dictionaries, exact marks and compound Poisson clusters
  description: For a random completely multiplicative function with independent symmetric signs at the
    primes, prescribed finite sign words form rare patterns whose overlaps affect their joint distribution.
    The results give Poisson comparisons for word dictionaries, including average bounds for uniformly
    sampled fixed-size and affine dictionaries, with each dictionary fixed inside the probability comparison.
    They retain exact excess lengths and signs, explain aggregation of pattern categories, and construct
    compound Poisson cluster laws with geometric marks. Arithmetic approximation uses the stated Poisson
    process, multivariate Stein and prime number theorem inputs; the combinatorial overlap formulas and
    target-law identities are proved internally.
  authors:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
