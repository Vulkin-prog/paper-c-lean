automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Codex agents"]
      framework: "Codex"
      tool_setup: >-
        Agent-assisted mathematical development, source checks, Lean builds,
        and independent agent review, directed by the human maintainer.
      prompting_notes: >-
        Preserve actual sources and targets, expose literature propositions,
        and use standalone challenge modules with separately proved bridges.
  notes: >-
    The repository contains the substantive proofs, so repository metadata is
    omitted and the ordinary substantive-development classification applies.
    Proof development and comparison-interface review are not human peer review.
fidelity:
  divergences: >-
    The overlap declaration states the exact iid finite-bit probability; it
    does not separately select the conditioned multiplicative overlap lemma.
    The dictionary endpoint selects the unconditional full-field convergence
    and the entire word-count vector in the growing critical regime. The
    exact-mark endpoint selects the unconditional quantitative full signed
    and unsigned fields; its separately proved averaged prime-atom form is
    not a selected declaration. The aggregate endpoint selects the full
    unsigned threshold path, with no threshold union bound, at rate at least
    one and throughout a logarithmic band under the hard information budget.
    The signed aggregate refinement and the literal finite C.1 ledger remain
    proved in the substantive development but are not separate selected
    endpoints. Full half-l1 distance on paths is used: the true laws are
    supported on countably many finite decreasing paths, as proved internally.
    Infinite excess counts and compound weights are not replaced by finitely
    many coordinate marginals; the configuration and unbounded random sum are
    explicitly constructed. The saddle parameter is defined by the unique
    real root, selected by epsilon; the solution proves its identity with the
    development's choice. Only AGG process and PNT are used by dictionary,
    exact-field and constant-window asymptotics; the aggregate theorem uses
    corrected Barbour and PNT. The remaining five selected declarations have
    no literature premises. None of these propositions is promoted to a
    Lean axiom or assumed arithmetic/TV conclusion.
review:
  status: "agent-reviewed"
  notes: >-
    Local solution compilation and autonomous challenge compilation are
    complete. Independent review of this newly selected interface and the
    current immutable-commit Comparator and NanoDa results must be supplied
    separately. Historical qualifications do not bind these new bytes.
