fidelity:
  divergences: Private-prime regularity, finite cylinders, conditioning traces and Palm presence events
    are explicit arithmetic objects. The G.3 target uses left-boundary labels; the Palm source uses run-start
    labels and subtracts one in its private-prime predicate. Both conventions are retained exactly. The
    normalized one-sided deficit bound does not claim that a regular target alone proves the arithmetic
    approximation. The absolute cumulant activity is defined by finite centered-moment recursion over
    all distinct-site category transversals. The obstruction is an eventual lower bound along prime q,
    with the exact window 2^(q-1+floor(log_2 q)). G.6–G.8 remain in the underlying development; they are
    not separately selected declarations in this configuration.
review:
  status: agent-reviewed
  notes: Source-to-interface bridges and selected statements were checked during preparation. Mechanical
    checks are recorded separately in qualification evidence. There is no independent human peer review
    or claimed Palomar decision.
