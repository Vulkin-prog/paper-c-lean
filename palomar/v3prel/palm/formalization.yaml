  scope: 9 selected declarations in ChallengeV3Palm, an autonomous Mathlib-only Challenge, with proofs
    in SolutionV3Palm. Arithmetic regular configurations with private prime pivots, exact source–target
    Palm mass identities, ordinary deletion and normalized deficit bounds. The independent target is regular
    with probability tending to one, while absolute cumulant activity has a positive normalized lower
    bound on prime scales for original and stronger retained sets. Intentional proof placeholders occur
    only in the Challenge. Literature inputs remain explicit theorem arguments and are not discharged
    by kernel validation. No Palomar editorial approval or registration is asserted.
  sorry_count: 0
  sorry_in_definitions: 0
