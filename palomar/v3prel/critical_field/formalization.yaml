  authors:
  - Richard Arratia
  - Larry Goldstein
  - Louis Gordon
  id: https://doi.org/10.1214/aop/1176991491
  type: paper
  location: Theorem 2, printed page 11, exact dependency-graph specialization
  relationship: background
  note: Process.ProcessAGGStatement states the finite field comparison in half-l1 convention with factor
    2(b1+b2), exact outside-vector independence, and all target coordinates. It is a visible theorem argument.
    The arithmetic dependency graph and its costs are proved internally, not supplied as premises.
- title: Newman's Short Proof of the Prime Number Theorem
  authors:
  - Don Zagier
  id: https://doi.org/10.2307/2975232
  type: paper
  location: American Mathematical Monthly 104 (1997), pages 705-708
  relationship: background
  note: Analysis.PrimeNumberTheoremRemainder is the ordinary prime-counting remainder o(t/log t), with
    Li(t)=Ei(log t). The normalization of Ei, saddle roots and weighted prime estimates are proved in
    the local development. No desired arithmetic error is assumed.
- title: Scalar Poisson Stein solution estimates, arXiv:1505.01417v3
  authors:
