version: v0.4
project:
  name: Critical Poisson fields and information-adapted conditioning
  description: For a random completely multiplicative function with independent symmetric signs at the
    primes, long constant runs are rare but arithmetically dependent. At critical intensity, their signed
    and marked run field admits a Poisson approximation retaining positions and exact excess lengths.
    The results include scalar and spatial laws, deterministic masks and statistics, conditioning on small-prime
    information, stable recorded variables and uniform quenched convergence. An information-adapted cutoff
    also respects a prescribed conditioning floor. The arithmetic comparisons use explicit finite Poisson
    process or scalar Stein bounds and the prime number theorem, as specified in each statement.
  authors:
  - name: Brice Pouly
    github: Vulkin-prog
    orcid: 0009-0008-8491-2467
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
