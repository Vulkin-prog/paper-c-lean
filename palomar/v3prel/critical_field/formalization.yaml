version: v0.4
project:
  name: V3PREL critical field and stable small-prime conditioning
  description: >-
    Poisson approximation for long constant runs, retaining their positions, exact excess
    lengths and both signs. The results cover critical lattice and diffuse limits, deterministic
    masks and statistics, conditioning on small primes under hard and soft information budgets,
    joint laws with recorded small-prime variables, and uniform almost-sure convergence of
    conditional scalar laws. Depending on the result, the external hypotheses are the prime
    number theorem, the finite dependency-graph Poisson process estimate of Arratia, Goldstein
    and Gordon, and scalar Poisson Stein solution bounds.
  authors:
  - Brice Pouly
  responsible_maintainers:
  - Brice Pouly
  license: Apache-2.0
classification:
  arxiv:
  - math.NT
  - math.PR
  msc2020:
  - 11K65
  - 60F05
sources:
