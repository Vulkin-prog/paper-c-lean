  location: Section 2.5, equations (2.14)-(2.15). Analysis.ScalarSteinFactorsStatement uses the published
    first-difference bound and the weaker zeroth bound min(1,lambda^(-1/2)).
  relationship: background
  note: Only the existence and analytic factors of the actual scalar Stein solution are external. No comparison
    or arithmetic conclusion is assumed.
