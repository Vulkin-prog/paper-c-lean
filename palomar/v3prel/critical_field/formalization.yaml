automation:
  methods:
  - method: agent
    models:
    - GPT-6 Codex agents
    framework: Codex
    tool_setup: Agent-assisted mathematical development, source checks, Lean builds, and independent agent
      review, directed by the human maintainer.
    prompting_notes: Preserve actual sources and targets, expose literature propositions, and use standalone
      challenge modules with separately proved bridges.
  notes: The repository contains the substantive proofs, so repository metadata is omitted and the ordinary
    substantive-development classification applies. Proof development and comparison-interface review
    are not human peer review.
fidelity:
  divergences: 'The family retains the actual prime-bit source. A classical epsilon defines the spatial
    finite-support configuration without hiding an existence assumption: exact_source_coefficients proves
    all its coefficients and the solution identifies it with the actual source. The hard spatial event
    theorem permits rates below one and assumes only a fixed upper rate bound; the soft theorem retains
    its printed one-intensity information budget. The scalar hard and soft assertions are genuine expectations
    over the full small-prime environment. The masked conditional kernel is quantitative before asymptotics
    and retains actual bad sites, graph edges, affine relation ranks, the retained mean and the Stein
    factor. The spatial conditional mean is over all signed excesses. The stable product lift uses a genuine
    expected conditional distance and one division by the positive conditioning probability; its source-facing
    specialization is countable in the approximated observation and arbitrary in the recorded variable.
    Uniform quenched scalar convergence uses geometric lower size scales and every admissible length.
    Diffuse convergence is weak convergence of actual probability laws of finite measures along arbitrary
    diverging size subsequences; the target is constructed by an independent Poisson count and iid uniform
    positions and geometric signed marks. Existential probability-law wrappers remove administrative measurability
    proofs from the challenge, not mathematical conclusions. Only process AGG, scalar Stein and PNT are
    used, explicitly as propositions; the global list of seven literature-input names is retained; the
    directional proposition was corrected in lot25, and this family does not depend on it, and no new
    Lean axiom or desired TV/rank conclusion is introduced. The information cutoff is transparently specified
    by its crossing; its existence, uniqueness and equality to the development are proved. The constrained
    maximum uses max(prescribed floor, crossing), preserving the actual sigma-field.'
review:
  status: agent-reviewed
  notes: Source-to-interface bridges and selected statements were checked during preparation.
    Mechanical checks are recorded separately in qualification evidence; this preparation review is
    not an independent human peer review. The published Version 3 files and source correspondence
    were checked for this update. Selected Lean statements and proofs are unchanged from the
    registered version 1. The new commit requires its own mechanical verification and version 2
    review; version 2 acceptance is not asserted.
