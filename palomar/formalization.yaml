version: "v0.4"

project:
  name: "Quantitative Poisson approximation in a dyadic block"
  description: >-
    Lean 4 formalization of a quantitative Poisson approximation for the
    starting points of long constant stretches of an extended Rademacher
    random completely multiplicative function in a dyadic block. The compared
    theorem uses a finite prime-sign cylinder and proves, uniformly in the
    critical window |L - log_2 N| <= C, that the total-variation distance to
    Pois(N/2^L) is O_C((log log N)^-2). It is conditional on three fully stated
    ordinary propositions specialized from Arratia--Goldstein--Gordon,
    Evertse--Silverman, and Nicolas--Robin; those propositions are theorem
    arguments, not Lean axioms.
  authors:
    - "Brice Pouly"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Brice Pouly"

# This repository contains the substantive development, so the optional
# repository block is intentionally omitted.

