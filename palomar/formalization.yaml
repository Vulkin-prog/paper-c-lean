fidelity:
  divergences: >-
    The paper starts from an infinite product of independent prime signs; the
    compared statement uses the finite uniform cylinder of primes at most
    2N+L because the dyadic observable is cylindrical. A separate proved
    target establishes the exact equality with the infinite law but is outside
    this entry. Bits in ZMod 2 encode signs. The sign function and start event
    are totalized on natural numbers, including unused small or out-of-cutoff
    values; the eventual dyadic theorem never observes those values. Total
    variation is the discrete half-l1 sum rather than the paper's equivalent
    supremum-over-events convention. UniformBigOOn exposes constants and
    quantifiers, with a threshold uniform in L and allowed to depend on C. The
    Lean statement permits C = 0 whereas the paper states C > 0. Most
    importantly, the paper states Theorem 1.1 without theorem-level premises,
    while the compared Lean theorem is explicitly conditional on the three
    source-shaped propositions hAGG, hES, and hDivisor. Their implications from
    the cited literature have agent-reviewed documentary certificates but no
    Lean proofs or independent external human certification.

