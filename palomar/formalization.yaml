  status: "agent-reviewed"
  reviewers:
    - "Claude Fable 5 agent instances"
    - "Claude Opus 4.8 agent instances"
    - "OpenAI GPT 5.6 Sol agent instances"
  notes: >-
    Distinct agent instances and models performed repeated adversarial
    mathematical, source, Lean, and release counter-reviews, alongside
    exhaustive mechanical declaration and axiom audits. This is neither
    independent scientific validation nor human peer review. No independent
    external human mathematical peer review has been completed. The three
    literature certificates assess source-to-proposition implications but do
    not turn the hypotheses into kernel-verified theorems.

alignment:
  namespace: "PaperCAudit"
  statements:
    - source: >-
        A critical Poisson law in a dyadic block, Theorem 1.1, printed/PDF
        p. 3; quantitative proof in Corollary 13.10, printed/PDF p. 43
      lean: "paper_c_theorem_one_one_finite_cylinder"
      module: "Solution"
      status: "proved modulo three explicit ordinary literature premises"
      note: >-
        For every C >= 0, uniformly when |L - log N/log 2| <= C, the
        finite-cylinder dyadic start-count law has total-variation distance
        O_C((log log N)^-2) from the Poisson law of rate N/2^L. The exact
        premises are hAGG, hES, and hDivisor; no other literature premise is
        consumed by the compared endpoint.

