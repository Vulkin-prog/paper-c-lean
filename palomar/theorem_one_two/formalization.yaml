fidelity:
  divergences: >-
    Clause (i) uses a finite uniform prime-sign cylinder because each masked
    count is cylindrical; the paper starts from an infinite product. The
    repository separately proves exact finite/infinite cylinder transfer.
    Bits in ZMod 2 encode signs, and the start predicates are totalized on
    natural numbers; eventual dyadic statements never observe the harmless
    exceptional small values. The displayed supremum over masks in clause
    (i) is represented by a final uniform quantifier over every mask contained
    in the dyadic block, and total variation is the equivalent discrete
    half-l1 expression. Clauses (ii) and (iii) are formalized through
    convergence of all relevant Laplace functionals rather than direct
    Tendsto statements for laws in the paper's vague topology. Clause (iii)
    pairs that characterization with uniform tightness of the discrete mark
    coordinate. The Lean endpoints permit C = 0 whereas the paper states
    C > 0. Most importantly, the paper states Theorem 1.2 without
    theorem-level premises, while all three compared Lean theorems are
    explicitly conditional on the source-shaped propositions hAGG, hES, and
    hDivisor. Their implications from the cited literature have
    agent-reviewed documentary certificates but no Lean proofs or independent
    external human certification.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Fable 5 agent instances"
    - "Claude Opus 4.8 agent instances"
    - "OpenAI GPT 5.6 Sol agent instances"
  notes: >-
    Distinct agent instances and models performed repeated adversarial
    mathematical, source, Lean, and release counter-reviews, alongside
    exhaustive mechanical declaration and axiom audits. These procedures are
    neither independent scientific validation nor human peer review. No
    independent external human mathematical peer review has been completed.
    The three literature certificates assess source-to-proposition
    implications but do not turn the hypotheses into kernel-verified
    theorems.

alignment:
  namespace: "PaperCAudit"
  statements:
    - source: "Paper C, Theorem 1.2(i), printed/PDF p. 3"
      lean: "paper_c_theorem_one_two_i_deterministic_masks"
      module: "SolutionTheoremOneTwo"
      status: "proved modulo three explicit ordinary literature premises"
      note: >-
        For every C >= 0, uniformly throughout the critical run-length
        window, the total-variation error tends to zero uniformly over every
        deterministic mask of the dyadic block.
    - source: "Paper C, Theorem 1.2(ii), printed/PDF p. 4"
      lean: "paper_c_theorem_one_two_ii_spatial_laplace"
      module: "SolutionTheoremOneTwo"
      status: "proved modulo three explicit ordinary literature premises"
      note: >-
        Along every critical-window sequence whose exact scale N/2^L tends to
        rate, the spatial source process has the stated Poisson
        Laplace-functional limit for every nonnegative continuous test on
        [1,2].
    - source: "Paper C, Theorem 1.2(iii), printed/PDF p. 4"
      lean: "paper_c_theorem_one_two_iii_marked_laplace_and_tightness"
      module: "SolutionTheoremOneTwo"
      status: "proved modulo three explicit ordinary literature premises"
      note: >-
        Along the same sequences, the complete marked source process has the
        marked Poisson Laplace-functional limit for every finitely
        mark-supported nonnegative continuous test, together with uniform
        tightness of the mark coordinate.

