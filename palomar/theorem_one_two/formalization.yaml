version: "v0.4"

project:
  name: "Paper C: masked, spatial, and marked Poisson limits"
  description: >-
    Lean 4 formalization of all three clauses of Paper C, Theorem 1.2.
    Clause (i) proves a total-variation Poisson approximation uniformly over
    every deterministic mask of the dyadic block. Clause (ii) gives the
    Laplace-functional characterization of the limiting spatial Poisson point
    process. Clause (iii) gives the corresponding marked characterization
    together with uniform tightness of the discrete marks. All three compared
    statements are conditional on exactly three fully stated ordinary
    propositions specialized from Arratia--Goldstein--Gordon,
    Evertse--Silverman, and Nicolas--Robin. Those propositions are theorem
    arguments, not Lean axioms.
  authors:
    - "Brice Pouly"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Brice Pouly"

classification:
  arxiv:
    - "math.NT"
    - "math.PR"
  msc2020:
    - "11K65"
    - "60F05"

sources:
  - title: >-
      A critical Poisson law in a dyadic block -- Starting points of long
      constant stretches of an extended Rademacher random completely
      multiplicative function
    authors:
      - "Brice Pouly"
    id: "https://doi.org/10.33774/coe-2026-z3l74"
    type: "paper"
    location: >-
      Theorem 1.2(i), printed/PDF p. 3, and Theorem 1.2(ii)--(iii),
      printed/PDF p. 4 of paper_C_complete_v09_en.pdf, SHA-256
      ccef4908838fc3b428aed862937a6a3a9129fc6e378fa7368384a9ed45b05189
    relationship: "adapts"
    note: >-
      Clause (i) uses the exact finite prime-sign cylinder for each masked
      count. Clauses (ii) and (iii) use the literal infinite product source
      measure. Because Mathlib does not presently provide the required
      topology of locally finite point measures, the latter clauses are
      registered through complete Laplace-functional characterizations;
      clause (iii) also records the proved mark-tail tightness needed for
      de-truncation.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Two moments suffice for Poisson approximations: the Chen--Stein method"
    authors:
      - "Richard Arratia"
      - "Larry Goldstein"
      - "Louis Gordon"
    id: "https://doi.org/10.1214/aop/1176991491"
    type: "paper"
    location: "Theorem 1 and definitions of b1, b2, and b3, printed pp. 10--11"
    relationship: "background"
    note: >-
      The finite dependency-graph specialization with exact outside-vector
      independence and b3 = 0 is exposed as the ordinary theorem hypothesis
      hAGG. Its source-to-hypothesis implication is documented by the
      AGG89-T1-finite-dependency-b3-zero agent-reviewed certificate; it is not
      proved in Lean or independently human-certified.
  - title: "Uniform bounds for the number of solutions to Y^n = f(X)"
    authors:
      - "J.-H. Evertse"
      - "J. H. Silverman"
    id: "https://doi.org/10.1017/S0305004100066068"
    type: "paper"
    location: "Theorem 1(b), printed p. 238"
    relationship: "background"
    note: >-
      The split-polynomial specialization K = L = Q with exponent two and an
      abscissa count is exposed as the ordinary theorem hypothesis hES. Its
      source-to-hypothesis implication is documented by the
      ES86-T1b-Q-split-n2 agent-reviewed certificate; it is not proved in Lean
      or independently human-certified.
  - title: "Majorations explicites pour le nombre de diviseurs de N"
    authors:
      - "J.-L. Nicolas"
      - "G. Robin"
    id: "https://doi.org/10.4153/CMB-1983-078-5"
    type: "paper"
    location: "Definition of f and Theorem 1, printed p. 485"
    relationship: "background"
    note: >-
      The direct logarithmic divisor inequality above n = 64, with the safe
      coefficient 2 log 2, is exposed as the ordinary theorem hypothesis
      hDivisor. Its source-to-hypothesis implication is documented by the
      NR83-T1-divisor-log-bound agent-reviewed certificate; it is not proved
      in Lean or independently human-certified.

