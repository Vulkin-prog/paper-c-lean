fidelity:
  divergences: >-
    The paper starts from an infinite product of independent prime signs; the
    compared statements use the finite uniform cylinder because every fixed
    dyadic count is cylindrical. The exact law transfer is proved elsewhere
    in the repository but is outside this entry. Bits in ZMod 2 encode signs,
    and the start event is totalized on natural numbers; eventual statements
    never observe the harmless exceptional small values. UniformLittleOOn and
    UniformBigOOn expose thresholds uniform in L and allowed to depend on C.
    The reciprocal-power predicate gives the precise Lean convention for
    N^(-1/2+o_C(1)). The Lean endpoints permit C = 0 whereas the paper states
    C > 0. The homogeneous-mass route uses the canonical technical parameter
    A = 3. Most importantly, the paper states the results without
    theorem-level premises, while the compared Lean theorems are explicitly
    conditional on the two source-shaped propositions hES and hDivisor.
    Their implications from the cited literature have agent-reviewed
    documentary certificates but no Lean proofs or independent external human
    certification.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Fable 5 agent instances"
    - "Claude Opus 4.8 agent instances"
    - "OpenAI GPT 5.6 Sol agent instances"
  notes: >-
    Distinct agent instances and models performed repeated adversarial
    mathematical, source, Lean, and release counter-reviews, alongside
    exhaustive mechanical declaration and axiom audits. These procedures are
    neither independent scientific validation nor human peer review. No
    independent external human mathematical peer review has been completed.
    The two literature certificates assess source-to-proposition implications
    but do not turn the hypotheses into kernel-verified theorems.

alignment:
  namespace: "PaperCAudit"
  statements:
    - source: "Paper C, Theorem 1.4, printed/PDF p. 4"
      lean: "paper_c_theorem_one_four_moments"
      module: "SolutionTheoremOneFour"
      status: "proved modulo two explicit ordinary literature premises"
      note: >-
        For every C >= 0, uniformly when |L - log N/log 2| <= C, Lean proves
        the N^(-1/2+o_C(1)) first-moment error, o_C(1) second
        falling-factorial-moment error, o_C(N^2) homogeneous mass, and o_C(1)
        variance error. The exact premises are hES and hDivisor.
    - source: "Paper C, Corollary 11.3, printed/PDF p. 38"
      lean: "paper_c_corollary_eleven_three"
      module: "SolutionTheoremOneFour"
      status: "proved modulo two explicit ordinary literature premises"
      note: >-
        For every C >= 0, there is c_R > 0 such that the homogeneous mass is
        uniformly O_C(N^2 exp(-c_R sqrt(log N)/log log N)) in the exact
        critical window. The exact premises are hES and hDivisor.

