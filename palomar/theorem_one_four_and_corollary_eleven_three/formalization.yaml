version: "v0.4"

project:
  name: "Paper C: moments and a quantitative homogeneous sum"
  description: >-
    Lean 4 formalization of the first two moments and variance of the number
    of long constant-stretch starts of an extended Rademacher random
    completely multiplicative function in a dyadic block, together with the
    quantitative exponential estimate for the separated homogeneous
    two-start sum. Uniformly in the critical window, Theorem 1.4 gives the
    first-moment rate, second falling-factorial-moment convergence,
    R_2(N,L)=o_C(N^2), and variance convergence; Corollary 11.3 gives the
    stronger bound R_2(N,L) <<_C N^2 exp(-c_R sqrt(log N)/log log N) for some
    c_R>0. Both compared statements are conditional on exactly two fully
    stated ordinary propositions specialized from Evertse--Silverman and
    Nicolas--Robin. Those propositions are theorem arguments, not Lean
    axioms.
  authors:
    - "Brice Pouly"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Brice Pouly"

classification:
  arxiv:
    - "math.NT"
    - "math.PR"
  msc2020:
    - "11K65"
    - "60F05"

sources:
  - title: >-
      A critical Poisson law in a dyadic block -- Starting points of long
      constant stretches of an extended Rademacher random completely
      multiplicative function
    authors:
      - "Brice Pouly"
    id: "https://doi.org/10.33774/coe-2026-z3l74"
    type: "paper"
    location: >-
      Theorem 1.4, printed/PDF p. 4, and Corollary 11.3, printed/PDF p. 38
      of paper_C_complete_v09_en.pdf, SHA-256
      ccef4908838fc3b428aed862937a6a3a9129fc6e378fa7368384a9ed45b05189
    relationship: "adapts"
    note: >-
      The compared statements use the exact finite prime-sign cylinder on
      which the dyadic observable is defined. For fixed N and L this is the
      cylindrical restriction of the paper's infinite product law. The
      repository proves the exact finite-cylinder/infinite-product law
      identity separately; that transfer is outside this Comparator target.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Uniform bounds for the number of solutions to Y^n = f(X)"
    authors:
      - "J.-H. Evertse"
      - "J. H. Silverman"
    id: "https://doi.org/10.1017/S0305004100066068"
    type: "paper"
    location: "Theorem 1(b), printed p. 238"
    relationship: "background"
    note: >-
      The split-polynomial specialization K = L = Q with exponent two and an
      abscissa count is exposed as the ordinary theorem hypothesis hES. Its
      source-to-hypothesis implication is documented by the
      ES86-T1b-Q-split-n2 agent-reviewed certificate; it is not proved in Lean
      or independently human-certified.
  - title: "Majorations explicites pour le nombre de diviseurs de N"
    authors:
      - "J.-L. Nicolas"
      - "G. Robin"
    id: "https://doi.org/10.4153/CMB-1983-078-5"
    type: "paper"
    location: "Definition of f and Theorem 1, printed p. 485"
    relationship: "background"
    note: >-
      The direct logarithmic divisor inequality above n = 64, with the safe
      coefficient 2 log 2, is exposed as the ordinary theorem hypothesis
      hDivisor. Its source-to-hypothesis implication is documented by the
      NR83-T1-divisor-log-bound agent-reviewed certificate; it is not proved
      in Lean or independently human-certified.

